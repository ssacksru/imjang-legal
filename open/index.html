<meta name="description" content="내 조건으로 더 좋은 집 찾기 — 전국 실거래가와 근거를 함께 봅니다.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="내집탐구">
<meta property="og:title" content="내집탐구 — 내 조건으로 더 좋은 집 찾기">
<meta property="og:description" content="전국 실거래가를 근거와 함께. 앱에서 이 단지의 추이를 확인하세요.">
<meta name="twitter:card" content="summary">

<style>
  /* 앱과 같은 시각 언어(theme/tokens.ts): 배경 #F7F5F0/#101214 · 코발트 #2257D6 ·
     보조 #747B86. 페이지가 곧 앱의 첫인상이라 자·위계도 앱 히어로를 따른다. */
  :root { color-scheme: light dark; }
  html,body { margin:0; }
  body {
    min-height:100vh; box-sizing:border-box; padding:28px 24px 40px;
    display:flex; flex-direction:column; align-items:center; gap:0;
    background:#F7F5F0; color:#171A1F;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  main, header, footer { width:100%; max-width:420px; }
  @media (prefers-color-scheme: dark) {
    body { background:#101214; color:#F5F5F7; }
    .sub, .basis, .tx-meta, .note { color:#98989D !important; }
    .card { background:#1A1D21 !important; border-color:#2A2E33 !important; }
    .btn.ghost { color:#8FAEFF !important; }
    .tx-chip { background:#2A2E33 !important; color:#C7CBD1 !important; }
  }

  .brand { font-size:13px; font-weight:700; letter-spacing:-0.1px; color:#2257D6; }
  .brand small { font-weight:500; color:#747B86; margin-left:6px; letter-spacing:0; }

  .card {
    margin-top:14px; padding:20px; border-radius:16px; background:#FFFFFF;
    border:1px solid #E4E1DA; box-sizing:border-box;
  }
  #pv-name { font-size:21px; font-weight:800; letter-spacing:-0.3px; line-height:1.3; }
  .sub { font-size:13px; line-height:1.55; color:#747B86; margin-top:4px; }
  #pv-price { font-size:17px; font-weight:700; margin-top:16px; letter-spacing:-0.2px;
              font-variant-numeric:tabular-nums; }
  .basis { font-size:12px; color:#747B86; margin-top:3px; font-variant-numeric:tabular-nums; }

  #pv-tx { margin-top:18px; }
  #pv-tx-title { font-size:13px; font-weight:700; margin:0 0 8px; }
  #pv-tx-rows { list-style:none; margin:0; padding:0; font-variant-numeric:tabular-nums; }
  #pv-tx-rows li {
    display:flex; align-items:baseline; gap:8px; padding:7px 0;
    border-top:1px solid rgba(128,128,128,0.14); font-size:13.5px;
  }
  .tx-date { color:#747B86; font-size:12px; flex:none; }
  .tx-price { font-weight:700; }
  .tx-meta { color:#747B86; font-size:12px; margin-left:auto; }
  .tx-chip { flex:none; font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:5px;
             background:#ECEAE5; color:#5A6068; }

  footer { display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:22px; text-align:center; }
  .btn {
    display:inline-block; padding:14px 22px; border-radius:999px;
    font-size:15px; font-weight:700; text-decoration:none;
    background:#2257D6; color:#fff; min-width:220px; box-sizing:border-box;
  }
  .btn.ghost { background:transparent; color:#2257D6; font-weight:600; font-size:14px; min-width:0; padding:8px 12px; }
  .note { font-size:12.5px; line-height:1.6; color:#747B86; margin:0; max-width:24em; }
  .stance { font-size:12px; color:#747B86; margin-top:2px; }
</style>
</head>

  <header><div class="brand">내집탐구<small>내 조건으로 더 좋은 집 찾기</small></div></header>

  <main id="preview" hidden class="card">

  <footer>
    <a class="btn" id="store" href="https://apps.apple.com/app/id6792628237">실거래 추이와 근거까지 앱에서 보기</a>
    <a class="btn ghost" id="retry" href="#">앱에서 열기</a>
    <p class="note" id="android-note" hidden>지금은 iOS에서 쓸 수 있어요. 위 실거래는 여기서 그대로 보실 수 있어요.</p>
    <p class="note">앱이 있으면 이 화면을 지나 바로 열려요.</p>
    <p class="stance">판정 대신, 근거를 드려요</p>
  </footer>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내집탐구에서 열기</title>
<meta name="description" content="내 조건으로 더 좋은 집 찾기 — 전국 실거래가와 근거를 함께 봅니다.">
<meta name="robots" content="noindex">
<!--
  ⚠️ 이 파일은 imjang 저장소 web/open/ 이 원본이다(생성물 — 직접 고치지 말 것).
     빌드: node scripts/build-open-page.mjs · 게시: node scripts/publish-open-page.mjs
     설계: docs/plans/2026-08-06-share-landing-design.md
  이 페이지는 **앱 단지 상세의 축소판**처럼 그린다(사용자 지시 2026-08-06 "앱의 현재 상태와
  흡사하게") — 네비바·히어로(자 한 줄 + 큰 값)·접힌 섹션 줄·실거래 목록의 문법을 앱
  theme/tokens.ts 값 그대로 옮겼다. 받은 사람이 "이 앱의 화면이 이렇겠구나"를 보게.
-->

<!-- 정적 OG(P1 기본 카드) — 워커(P2)가 단지별로 바꾼다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="내집탐구">
<meta property="og:title" content="내집탐구 — 내 조건으로 더 좋은 집 찾기">
<meta property="og:description" content="전국 실거래가를 근거와 함께. 앱에서 이 단지의 추이를 확인하세요.">
<meta name="twitter:card" content="summary">

<style>
  /* 앱 theme/tokens.ts 이식: light/dark 팔레트·타이포 스케일(price.hero 32/38 -0.6 ·
     sectionTitle 17/22 600 · subheadline 15/20 · caption 12/16). */
  :root {
    color-scheme: light dark;
    --canvas:#F7F5F0; --card:#FFFFFF; --border:#E4E1DA; --pressed:#EDEBE6;
    --t1:#171A1F; --t2:#525862; --t3:#747B86; --muted:#9A9FA7;
    --accent:#2257D6; --grid:#ECECF0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas:#101214; --card:#1B1E22; --border:#38383A; --pressed:#333940;
      --t1:#F5F5F7; --t2:#C7C7CC; --t3:#98989D; --muted:#636366;
      --accent:#8FAEFF; --grid:#2C2C2E;
    }
  }
  html,body { margin:0; }
  body {
    min-height:100vh; background:var(--canvas); color:var(--t1);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap { max-width:420px; margin:0 auto; padding-bottom:44px; }

  /* 네비바 — 앱 상단 바와 같은 문법(가운데 제목 · 오른쪽 공유/홈). sticky로 앱처럼 붙는다. */
  nav {
    position:sticky; top:0; z-index:2; background:var(--canvas);
    display:grid; grid-template-columns:56px 1fr 56px; align-items:center;
    height:48px; border-bottom:0.5px solid var(--border);
  }
  nav .ttl { grid-column:2; text-align:center; font-size:17px; font-weight:600; letter-spacing:-0.2px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  nav .btns { grid-column:3; display:flex; gap:12px; justify-content:flex-end; padding-right:16px; }
  nav .btns a, nav .btns button {
    background:none; border:none; padding:4px; margin:0; cursor:pointer;
    color:var(--accent); font-size:17px; line-height:1; text-decoration:none;
  }

  #pv-scene { aspect-ratio: 100/45; overflow:hidden; border-bottom:0.5px solid var(--border); }
  #pv-scene svg { width:100%; height:100%; }

  .hero { padding:20px 20px 12px; }
  .basis { font-size:15px; line-height:20px; letter-spacing:-0.1px; color:var(--t2); }
  .basis .i { font-size:12px; color:var(--muted); }
  .hero-price { font-size:32px; line-height:38px; font-weight:700; letter-spacing:-0.6px;
                font-variant-numeric:tabular-nums; margin-top:2px; }
  .hero-sub2 { font-size:13px; line-height:18px; color:var(--t2); margin-top:6px;
               font-variant-numeric:tabular-nums; }
  .hero-sub { font-size:12px; line-height:16px; color:var(--t3); margin-top:8px; }

  .locsec { padding-top:20px !important; }
  .loc-row { font-size:13px; line-height:19px; color:var(--t2); padding:2.5px 0;
             font-variant-numeric:tabular-nums; }
  .loc-like { font-size:13px; line-height:19px; color:var(--t2); margin-top:6px;
              font-variant-numeric:tabular-nums; }

  /* 입지·비교 테이블 — 행 전체가 링크(네이버지도 / 다른 단지 페이지). 눌린다는 신호는
     오른쪽 ↗ 하나로 조용히. */
  .loctab { margin-top:6px; font-variant-numeric:tabular-nums; }
  .loctab a { display:grid; grid-template-columns:22px 1fr auto 14px; gap:8px; align-items:baseline;
              padding:8px 0; border-bottom:0.5px solid var(--border); text-decoration:none; color:inherit; }
  .loctab a:active { background:var(--pressed); }
  .loctab .li { font-size:13px; }
  .loctab .ln { font-size:13.5px; font-weight:600; color:var(--t1);
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .loctab .ln small { font-weight:400; color:var(--t3); margin-left:6px; }
  /* 공동학구 — 함께 배정된 나머지 학교. 줄바꿈해서 값 열을 밀지 않는다. */
  .loctab .ln .lnote { display:block; margin-left:0; margin-top:2px; color:var(--t2); }
  /* 희소성 배지 — 그림에 **그려진** 것에만 붙는다("초품아 전국 36.5%").
     강조색을 쓰되 값보다 크지 않게: 이건 사실 표기지 훈장이 아니다. */
  .loctab .lbadge { margin-left:6px; font-size:10.5px; font-weight:600; padding:2px 6px;
                    border-radius:5px; background:var(--accent); color:#fff; white-space:nowrap; }
  @media (prefers-color-scheme: dark) { .loctab .lbadge { color:#111; } }
  .loctab .lv { font-size:13px; color:var(--t2); text-align:right; }
  .loctab .go { font-size:11px; color:var(--muted); text-align:right; }
  .loctab .lrow-plain { display:grid; grid-template-columns:22px 1fr; gap:8px; padding:8px 0;
                        border-bottom:0.5px solid var(--border); font-size:13px; color:var(--t2); }

  /* 풍경 핫스팟 — 보이지 않되 눌리면 반응한다(그림을 가리지 않는다) */
  .hotspot { position:absolute; border-radius:8px; }
  .hotspot:active { background:rgba(34,87,214,0.14); }

  /* 규제 배지 — 앱 RegulationBadge의 결(경고색이되 판정 아님·사실만) */
  /* 공유된 매물 블록 — 히어로와 같은 활자를 쓰되, 위에 얇은 구분을 둬 "이건 이 매물"임을 만든다. */
  .rentsec { padding:18px 20px 4px; }
  .rentsec .hero-price { margin-top:2px; }
  .rent-gone { margin-top:8px; font-size:13px; line-height:18px; color:var(--t2); }
  .rent-ctx { margin:16px 0 0; padding-top:14px; border-top:1px solid var(--border);
    font-size:13px; font-weight:600; color:var(--t3); letter-spacing:-0.1px; }
  .reg { margin:10px 20px 0; padding:9px 12px; border-radius:10px; font-size:12.5px; line-height:17px;
         background:rgba(178,106,0,0.10); color:#B26A00; border:0.5px solid rgba(178,106,0,0.25);
         font-variant-numeric:tabular-nums; }
  @media (prefers-color-scheme: dark) { .reg { color:#FFB340; background:rgba(255,179,64,0.10); border-color:rgba(255,179,64,0.28); } }

  /* 평형별 시세 표 — 375pt에서 4열이 서게 grid로 */
  .bands { margin-top:8px; font-variant-numeric:tabular-nums; }
  .bands .brow { display:grid; grid-template-columns: 62px 1fr 1fr 58px; gap:6px;
                 padding:7px 0; border-bottom:0.5px solid var(--border); align-items:baseline; }
  .bands .bhead { font-size:11px; color:var(--muted); border-bottom-width:0; padding-bottom:2px; }
  .bands .bb { font-size:13px; font-weight:600; color:var(--t1); }
  .bands .bv { font-size:13px; color:var(--t1); }
  .bands .bs { font-size:11px; color:var(--t3); }
  .bands .bcur { color:var(--accent); }

  /* 접힌 섹션 줄 — 앱 FoldSection과 같은 자리·같은 문법. 이 페이지의 청중은 미설치자라
     도착지는 App Store다(제스처를 흉내만 내는 죽은 줄을 두지 않는다). */
  .fold {
    display:flex; align-items:center; gap:8px; min-height:44px; padding:0 20px;
    text-decoration:none; color:inherit;
  }
  .fold:active { background:var(--pressed); }
  .fold .ft { font-size:17px; font-weight:600; letter-spacing:-0.2px; color:var(--t1); }
  .fold .fs { margin-left:auto; font-size:12px; color:var(--t3); }
  .fold .chev { color:var(--muted); font-size:13px; font-weight:700; }

  .chart-wrap { padding:14px 20px 0; }
  .chart-note { font-size:12px; color:var(--muted); padding:4px 20px 0; font-variant-numeric:tabular-nums; }
  svg text { font-family:inherit; }

  .txsec { padding:28px 20px 0; }
  .txsec h2 { font-size:17px; font-weight:600; letter-spacing:-0.2px; margin:0; }
  .txcap { font-size:12px; color:var(--t3); margin-top:2px; font-variant-numeric:tabular-nums; }
  #pv-tx-rows { list-style:none; margin:6px 0 0; padding:0; font-variant-numeric:tabular-nums; }
  #pv-tx-rows li { display:flex; align-items:baseline; gap:8px; padding:9px 0;
                   border-bottom:0.5px solid var(--border); }
  .tx-price { font-size:18px; font-weight:700; letter-spacing:-0.25px; }
  .tx-chip { flex:none; font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:5px;
             background:var(--pressed); color:var(--t2); }
  .tx-meta { margin-left:auto; font-size:12px; color:var(--t3); text-align:right; }

  footer { display:flex; flex-direction:column; align-items:center; gap:12px;
           margin-top:30px; padding:0 20px; text-align:center; }
  .btn {
    display:block; width:100%; max-width:340px; padding:15px 22px; border-radius:12px;
    font-size:15px; font-weight:700; text-decoration:none; text-align:center;
    background:var(--accent); color:#fff; box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark) { .btn { color:#111; } }
  .btn.ghost { background:transparent; color:var(--accent); font-weight:600; font-size:14px; padding:8px 12px; }
  .note { font-size:12.5px; line-height:1.6; color:var(--t3); margin:0; max-width:24em; }
  .stance { font-size:12px; color:var(--muted); margin-top:0; }
  .brandline { font-size:12px; color:var(--t3); margin-top:14px; }
  .brandline b { color:var(--accent); font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="ttl" id="nav-title">내집탐구</div>
    <div class="btns">
      <!-- 앱 헤더의 그 두 버튼(공유 ↥ · 홈 ⌂). 여기선 ↥=이 페이지 공유(Web Share),
           ⌂=App Store — 미설치자의 '홈'은 스토어다. -->
      <button id="share-btn" hidden aria-label="공유">&#8613;</button>
      <a id="home-btn" href="https://apps.apple.com/app/id6792628237" aria-label="App Store">&#8962;</a>
    </div>
  </nav>

  <main id="preview" hidden>
    <!-- 단지 풍경 — 앱과 같은 buildScene(같은 소스). 열리는 순간 하나씩 지어지고,
         그림 속 오브젝트는 **실제로 눌린다**(핫스팟 → 네이버지도). 앱의 '그림 탭 → 지도'
         문법의 웹 번역 — 미설치자의 지도는 네이버지도다. -->
    <div id="pv-scene" hidden style="position:relative">
      <!-- 애니메이션이 프레임마다 innerHTML을 갈아엎으므로 SVG는 내부 div에 격리 —
           핫스팟(a.hotspot)은 바깥(pv-scene)에 붙어 살아남는다. -->
      <div id="pv-scene-svg"></div>
    </div>
    <div class="chart-note" id="pv-scene-note" hidden></div>
    <!-- 공유된 전월세 매물 — 링크에 매물 신원(t·m·p·r)이 얹혀 있을 때만 뜬다(2026-08-25).
         **히어로보다 위**다: 공유한 것이 이 매물이므로 먼저 읽혀야 한다. 아래 단지 히어로는
         "이 단지" 맥락으로 남는다(사용자 지적 "전세 공유인데 단지 기본 페이지가 열린다"). -->
    <section id="pv-rent" hidden class="rentsec">
      <div class="basis" id="pv-rent-kind"></div>
      <div class="hero-price" id="pv-rent-price"></div>
      <div class="hero-sub2" id="pv-rent-spec"></div>
      <!-- 실거래는 **다른 줄**에 — 호가와 성사가를 한 줄에 섞지 않는다(공유 규약 ④). -->
      <div class="hero-sub2" id="pv-rent-base" hidden></div>
      <div class="rent-gone" id="pv-rent-gone" hidden></div>
      <div class="rent-ctx" id="pv-rent-ctx" hidden></div>
    </section>
    <div class="hero">
      <div class="basis" id="pv-basis-line" hidden></div>
      <div class="hero-price" id="pv-price" hidden></div>
      <div class="hero-sub2" id="pv-jeonse" hidden></div>
      <div class="hero-sub" id="pv-sub"></div>
    </div>
    <!-- 규제 배지 — 매수 가능성 자체를 바꾸는 조건이라 가격 바로 아래(앱과 같은 자리) -->
    <div id="pv-reg" hidden class="reg"></div>
    <!-- 입지 테이블 — 전부 서버 값·전부 눌린다(네이버지도). 없으면 그 줄이 없다. -->
    <section class="txsec locsec" id="pv-loc" hidden>
      <h2>입지</h2>
      <!-- 그림과 표를 잇는 한 줄 — "왜 이게 그려졌지?"의 답 -->
      <div class="txcap" id="pv-loc-cap" hidden></div>
      <div id="pv-loc-rows" class="loctab"></div>
    </section>

    <!-- 평형별 시세 — metrics RPC의 밴드 전부(서버 계산값) -->
    <section class="txsec" id="pv-bands" hidden>
      <h2>평형별 시세</h2>
      <div class="txcap" id="pv-bands-cap"></div>
      <div id="pv-bands-rows" class="bands"></div>
    </section>

    <a class="fold" id="fold-listings" hidden href="https://apps.apple.com/app/id6792628237">
      <span class="ft">지금 나온 매물</span><span class="fs">앱에서</span><span class="chev">&#8250;</span>
    </a>
    <a class="fold" id="fold-position" hidden href="https://apps.apple.com/app/id6792628237">
      <span class="ft">이 가격은 어디쯤인가</span><span class="fs">앱에서</span><span class="chev">&#8250;</span>
    </a>

    <div class="chart-wrap" id="pv-chart" hidden></div>
    <div class="chart-note" id="pv-chart-note" hidden></div>

    <section class="txsec" id="pv-tx" hidden>
      <h2>실거래 내역</h2>
      <div class="txcap" id="pv-tx-cap"></div>
      <ol id="pv-tx-rows"></ol>
    </section>

    <!-- 주변 단지 — complex_band_summary bbox 직조회(0196). 행을 누르면 그 단지의
         공유 페이지로 — 카드가 카드를 물고 간다. -->
    <section class="txsec" id="pv-similar" hidden>
      <h2>주변 단지</h2>
      <div class="txcap" id="pv-similar-cap"></div>
      <div id="pv-similar-rows" class="loctab"></div>
    </section>

    <!-- 이 동네 입주 예정 — region_supply_summary(향후 2년, 한국부동산원) -->
    <section class="txsec" id="pv-supply" hidden>
      <h2>이 동네 입주 예정</h2>
      <div class="txcap" id="pv-supply-cap"></div>
      <div id="pv-supply-rows" class="loc-like"></div>
    </section>
  </main>

  <!-- 자료가 없거나 실패해도 여기부터는 항상 선다(설계 §2-3: 중계가 1급). -->
  <footer>
    <div id="pv-name-fallback" hidden style="font-size:17px;font-weight:700;"></div>
    <a class="btn" id="store" href="https://apps.apple.com/app/id6792628237">실거래 추이와 근거까지 앱에서 보기</a>
    <a class="btn ghost" id="retry" href="#">앱에서 열기</a>
    <p class="note" id="android-note" hidden>지금은 iOS에서 쓸 수 있어요. 위 실거래는 여기서 그대로 보실 수 있어요.</p>
    <p class="note">앱이 있으면 이 화면을 지나 바로 열려요.</p>
    <p class="stance">판정 대신, 근거를 드려요</p>
    <p class="brandline"><b>내집탐구</b> · 내 조건으로 더 좋은 집 찾기</p>
  </footer>
